name: Build Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci -f
      - name: Write signing key
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: echo "$CRX_KEY" > key.pem
      - run: npm run build-release
      - uses: actions/upload-artifact@v4
        with:
          name: floccus-build-${{ github.sha }}
          path: builds/*
          retention-days: 30
